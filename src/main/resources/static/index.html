<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ECEEEA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141C26" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="/fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/barlow-semi-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <title>MicroHub</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <header class="topbar">
    <a class="brand" href="#/news" aria-label="MicroHub Startseite">
      <!-- Der „Hub“: ein Knoten, an dem fünf Bereiche zusammenlaufen (News, Termine, Müll, Kontakte, Brett).
           Die Punkte leuchten reihum auf, als kämen Nachrichten am Knoten an. -->
      <svg class="brand-hub" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <g class="hub-spokes">
          <line x1="16" y1="16" x2="16" y2="5"/>
          <line x1="16" y1="16" x2="26.46" y2="12.6"/>
          <line x1="16" y1="16" x2="22.47" y2="24.9"/>
          <line x1="16" y1="16" x2="9.53" y2="24.9"/>
          <line x1="16" y1="16" x2="5.54" y2="12.6"/>
        </g>
        <circle class="hub-dot" cx="16" cy="5" r="2.9" style="--sec: var(--c-news); --i: 0"/>
        <circle class="hub-dot" cx="26.46" cy="12.6" r="2.9" style="--sec: var(--c-events); --i: 1"/>
        <circle class="hub-dot" cx="22.47" cy="24.9" r="2.9" style="--sec: var(--c-waste); --i: 2"/>
        <circle class="hub-dot" cx="9.53" cy="24.9" r="2.9" style="--sec: var(--c-contacts); --i: 3"/>
        <circle class="hub-dot" cx="5.54" cy="12.6" r="2.9" style="--sec: var(--c-board); --i: 4"/>
        <circle class="hub-core" cx="16" cy="16" r="3.8"/>
      </svg>
      MicroHub
    </a>
    <div class="account" id="account"></div>
  </header>

  <nav class="tabs" aria-label="Bereiche">
    <a href="#/news" data-section="news"><span class="tab-mark"></span><span>News</span></a>
    <a href="#/kalender" data-section="kalender"><span class="tab-mark"></span><span>Kalender</span></a>
    <a href="#/kontakte" data-section="kontakte"><span class="tab-mark"></span><span>Kontakte</span></a>
    <a href="#/brett" data-section="brett"><span class="tab-mark"></span><span class="short">Brett</span><span class="long">Schwarzes Brett</span></a>
  </nav>

  <main id="main" tabindex="-1">
    <p class="loading">Wird geladen …</p>
  </main>

  <noscript>
    <p class="notice">MicroHub braucht JavaScript. Bitte aktiviere es in deinem Browser.</p>
  </noscript>
</body>
</html>
